spring:
  application:
    name: skylane
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/skylane}
    username: ${DATABASE_USERNAME:skylane}
    password: ${DATABASE_PASSWORD:skylane}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # API fields are snake_case (design.md §4); the FE types depend on this.
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

skylane:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-days: 7
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:3000}
  routing:
    provider: ${ROUTING_PROVIDER:ors}
    ors-api-key: ${ORS_API_KEY:}
    osrm-base-url: ${OSRM_URL:}
    # Round 1 (README): routing.openstreetmap.de, no key; falls back to straight line x fallback-factor.
    osm-base-url: https://routing.openstreetmap.de/routed-foot/route/v1/foot
    timeout-ms: 3000
    fallback-factor: 1.3
  pricing:
    usd-per-kg-mile: 1.00
    min-cents: 100
  quote:
    ttl-minutes: 10
    stale-tolerance-minutes: 5
    drone-max-kg: 2
    robot-max-kg: 10
    drone-max-round-trip-km: 15
    robot-speed-mps: 1.5
    drone-speed-mps: 15
    handling-minutes: 1
    drone-overhead-minutes: 2
  service-area:
    min-lat: 37.70
    max-lat: 37.84
    min-lng: -122.52
    max-lng: -122.35
  sim:
    speed: 1.0
  dev:
    user-email: alice@skylane.dev

logging:
  level:
    org.flywaydb: INFO
