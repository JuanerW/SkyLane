<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>SkyLane Backend Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>
/* Layout: 顶部说明 → 左侧可点击架构图（横向可滚动）+ 右侧检查器；窄屏纵向堆叠。配色沿用 diagram-design 默认皮肤 */
:root {
  --paper: #f5f5f5; --paper-2: #ececec; --panel: #fbfbfb; --ink: #2d3142; --muted: #4f5d75; --soft: #5a6580;
  --rule: rgba(45,49,66,0.12); --rule-solid: #bfc0c0; --accent: #bf4520; --accent-tint: rgba(191,69,32,0.08);
  --link: #2e5aa8; --link-tint: rgba(46,90,168,0.08); --zone: rgba(45,49,66,0.025);
  --sans: "IBM Plex Sans", "Noto Sans SC", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #2d3142; --paper-2: #393e53; --panel: #333849; --ink: #f5f5f5; --muted: #bfc0c0; --soft: #949eb2;
  --rule: rgba(245,245,245,0.12); --rule-solid: rgba(191,192,192,0.25); --accent: #f08a59; --accent-tint: rgba(240,138,89,0.12);
  --link: #739fdf; --link-tint: rgba(115,159,223,0.12); --zone: rgba(245,245,245,0.03); color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #2d3142; --paper-2: #393e53; --panel: #333849; --ink: #f5f5f5; --muted: #bfc0c0; --soft: #949eb2;
  --rule: rgba(245,245,245,0.12); --rule-solid: rgba(191,192,192,0.25); --accent: #f08a59; --accent-tint: rgba(240,138,89,0.12);
  --link: #739fdf; --link-tint: rgba(115,159,223,0.12); --zone: rgba(245,245,245,0.03); color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px }
.wrap { max-width: 1680px; margin: 0 auto; display: grid; gap: 16px }
header { display: grid; gap: 6px }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--soft) }
h1 { margin: 0; font-size: 22px; font-weight: 600; text-wrap: balance }
.lede { margin: 0; color: var(--muted); max-width: 78ch }
.bar { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; font-size: 12.5px; color: var(--muted) }
.key { display: inline-flex; align-items: center; gap: 6px }
.key svg { flex: none }
.toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none }
.toggle input { accent-color: var(--accent) }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 16px; align-items: start }
@media (max-width: 1100px) { .grid { grid-template-columns: minmax(0, 1fr) } }
.canvas { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; overflow-x: auto }
.canvas svg { display: block; width: 100%; min-width: 960px; height: auto }
.hint { font-size: 12px; color: var(--soft); padding: 8px 12px; border-top: 1px solid var(--rule) }
/* SVG */
.node { cursor: pointer }
.node rect, .node path.shape, .node ellipse { fill: var(--panel); stroke: var(--ink); stroke-width: 1; transition: stroke .12s, fill .12s }
.node text { font-family: var(--mono); font-size: 12.5px; fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none }
.node text.sub { font-family: var(--sans); font-size: 10.5px; fill: var(--soft) }
.node.focal rect, .node.focal path.shape { stroke: var(--accent); stroke-width: 1.5 }
.node.ext rect { stroke: var(--rule-solid); stroke-dasharray: 3 3 }
.node.later rect { stroke-dasharray: 5 4; stroke: var(--soft) }
.node.later text { fill: var(--soft) }
.node:hover rect, .node:hover path.shape { fill: var(--paper-2) }
.node:focus { outline: none }
.node:focus-visible rect { stroke: var(--link); stroke-width: 2 }
.node.sel rect, .node.sel path.shape, .node.sel ellipse { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 2 }
.node.nb rect { stroke: var(--link); stroke-width: 1.5 }
.dim .node:not(.sel):not(.nb) { opacity: .35 }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.1; opacity: .55 }
.edge.later { stroke-dasharray: 4 3; stroke-width: 1 }
.dim .edge { opacity: .12 }
.dim .edge.out { opacity: 1; stroke: var(--accent); stroke-width: 1.6 }
.dim .edge.in { opacity: 1; stroke: var(--link); stroke-width: 1.6 }
.zone { fill: var(--zone); stroke: var(--rule); stroke-width: .8 }
.colhead { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; fill: var(--soft); text-anchor: middle }
.zonelabel { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; fill: var(--soft) }
/* 检查器 */
.inspector { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; display: grid; gap: 14px;
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 32px); overflow: auto; min-width: 0 }
@media (max-width: 1100px) { .inspector { position: static; max-height: none } }
.ihead { display: grid; gap: 6px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--rule-solid); color: var(--muted) }
.chip.mvp { border-color: var(--accent); color: var(--accent) }
.iname { font-family: var(--mono); font-size: 18px; font-weight: 600; overflow-wrap: anywhere; margin: 0 }
.pkg { font-family: var(--mono); font-size: 12px; color: var(--soft); overflow-wrap: anywhere }
.role { margin: 0 }
.sec { display: grid; gap: 6px; min-width: 0 }
.sec h3 { margin: 0; font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--soft) }
.sec ul { margin: 0; padding-left: 18px; display: grid; gap: 3px }
code, .mono { font-family: var(--mono); font-size: 12px }
pre { margin: 0; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; overflow-x: auto; font-family: var(--mono); font-size: 12px; line-height: 1.5 }
.ep { border: 1px solid var(--rule); border-radius: 6px; padding: 10px; display: grid; gap: 6px; min-width: 0 }
.ep .line { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap }
.verb { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--link); color: var(--panel) }
.verb.sse { background: var(--accent) }
.path { font-family: var(--mono); font-size: 13px; font-weight: 600; overflow-wrap: anywhere }
.kv { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 2px 8px; font-size: 12.5px }
.kv dt { color: var(--soft) } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere }
.links { display: flex; flex-wrap: wrap; gap: 6px }
.links button { font-family: var(--mono); font-size: 11.5px; padding: 3px 8px; border-radius: 5px; border: 1px solid var(--rule-solid); background: none; color: var(--ink); cursor: pointer }
.links button.o { border-color: var(--accent); color: var(--accent) }
.links button.i { border-color: var(--link); color: var(--link) }
.links button:hover { background: var(--paper-2) }
.links button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px }
.none { color: var(--soft); font-size: 12.5px }
table { border-collapse: collapse; width: 100%; font-size: 12.5px }
th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--rule); vertical-align: top }
th { color: var(--soft); font-weight: 500 }
.tw { overflow-x: auto }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">SkyLane · MVP 后端设计 · Spring Boot 分层</div>
    <h1>SkyLane 后端结构图</h1>
    <p class="lede">参照 Twitch / Staybooking 的 Controller → Service → Repository 分层。MVP 覆盖 Login、新建订单、Tracking、Review。点击任意方块，右侧会显示它的职责、接口、方法签名、对应的前端页面、数据表，以及它调用谁、被谁调用。另见 <a href="frontend.html" style="color:var(--link)">前端结构图</a> 和 <a href="database.html" style="color:var(--link)">数据库结构图</a>。</p>
    <div class="bar">
      <span class="key"><svg width="28" height="10" aria-hidden="true"><line x1="0" y1="5" x2="28" y2="5" stroke="var(--accent)" stroke-width="2"/></svg>选中节点调用的</span>
      <span class="key"><svg width="28" height="10" aria-hidden="true"><line x1="0" y1="5" x2="28" y2="5" stroke="var(--link)" stroke-width="2"/></svg>调用选中节点的</span>
      <span class="key"><svg width="28" height="10" aria-hidden="true"><rect x="1" y="1" width="26" height="8" rx="2" fill="none" stroke="var(--soft)" stroke-dasharray="4 3"/></svg>后续阶段</span>
      <label class="toggle"><input type="checkbox" id="showLater" checked>显示 Smart Recommendation / Agent Mode</label>
    </div>
  </header>

  <div class="grid">
    <section class="canvas" aria-label="架构图">
      <svg id="diagram" viewBox="0 0 1330 820" role="img" aria-label="SkyLane 后端分层架构图"></svg>
      <div class="hint">图较宽时可左右滑动。键盘：Tab 选中方块，Enter 查看详情。</div>
    </section>
    <aside class="inspector" id="inspector" aria-live="polite"></aside>
  </div>
</div>

<script>
const PKG = "com.laioffer.skylane";

// ---------------- 节点 ----------------
// kind: client | app | controller | service | component | repo | external | db | config
// phase: mvp | later
const N = {
  Browser: { label: "Next.js 前端", sub: "浏览器", kind: "client", x: 20, y: 300, w: 116, h: 90, phase: "mvp",
    role: "Next.js + TypeScript。所有请求经 src/lib/api.ts 统一加 Authorization 头并处理错误体；token 存 localStorage。SSE 用 fetch + ReadableStream 读取（EventSource 不能带头）。地址补全直接调用 Photon，不经过后端。",
    pages: [
      ["/login", "登录 / 注册 / Google 登录", "POST /auth/register · /auth/login · /auth/google"],
      ["/ship", "Step 1 填写，Step 2 方案卡片 + 地图，点选下单", "GET /stations · POST /quotes · POST /orders"],
      ["/orders", "My orders 列表", "GET /orders"],
      ["/orders/[id]", "订单详情、时间线、取消、完成后评价", "GET /orders/{id} · POST /orders/{id}/cancel · POST /orders/{id}/review"],
      ["/orders/[id]/track", "地图上的设备移动、进度、剩余时间", "GET /orders/{id}/track (SSE)"],
    ] },

  SkyLaneApplication: { label: "SkyLaneApplication", kind: "app", x: 200, y: 20, w: 720, h: 40, phase: "mvp", pkg: PKG,
    role: "@SpringBootApplication + @EnableScheduling 入口。application.yaml 配置数据源、JWT、Google Client ID、OSRM 地址、模拟器倍速。",
    code: `skylane:
  jwt.secret: \${JWT_SECRET}
  jwt.ttl-days: 7
  google.client-id: \${GOOGLE_CLIENT_ID}
  cors.allowed-origins: \${FRONTEND_ORIGIN}
  routing.provider: ors          # ors | osrm
  routing.ors-api-key: \${ORS_API_KEY}
  routing.osrm-base-url: \${OSRM_URL:}
  pricing.usd-per-kg-mile: 1.00
  pricing.min-cents: 100         # 最低 $1
  quote.ttl-minutes: 10
  quote.stale-tolerance-minutes: 5
  service-area: 37.70–37.84, −122.52 – −122.35
  sim.speed: 1.0                 # 演示时可调成 10
spring.jpa.hibernate.ddl-auto: validate   # 结构由 Flyway 管理` },

  // ---- Controller ----
  AuthController: { label: "AuthController", kind: "controller", x: 200, y: 100, w: 200, h: 44, phase: "mvp", pkg: PKG + ".user",
    role: "注册、登录、Google 登录、读取当前用户。除 /auth/** 外，所有接口都要求登录。",
    eps: [
      { m: "POST", p: "/auth/register", req: "RegisterRequest(email, password ≥ 8, display_name)", res: "201 AuthResponse(access_token, user)", err: "400 VALIDATION_ERROR · 409 EMAIL_TAKEN", fe: "/login 注册表单" },
      { m: "POST", p: "/auth/login", req: "LoginRequest(email, password)", res: "200 AuthResponse", err: "401 INVALID_CREDENTIALS", fe: "/login 登录表单" },
      { m: "POST", p: "/auth/google", req: "GoogleLoginRequest(id_token)", res: "200 AuthResponse", err: "401 INVALID_GOOGLE_TOKEN", fe: "/login Google 按钮" },
      { m: "GET", p: "/me", req: "—", res: "200 UserDto(id, email, display_name, has_password, google_linked, created_at)", err: "401 UNAUTHORIZED", fe: "AuthProvider 恢复登录态、/account" },
      { m: "PATCH", p: "/me", req: "UpdateProfileRequest(display_name)", res: "200 UserDto", err: "400 VALIDATION_ERROR", fe: "/account Save changes" },
      { m: "PUT", p: "/me/password", req: "ChangePasswordRequest(current_password, new_password)", res: "200 AuthResponse（新 token；token_version +1，旧 token 失效）", err: "401 INVALID_CREDENTIALS · 409 NO_PASSWORD", fe: "/account Change password" },
    ] },
  QuoteController: { label: "QuoteController", kind: "controller", x: 200, y: 180, w: 200, h: 44, phase: "mvp", pkg: PKG + ".quote",
    role: "站点列表和报价。报价只计算并保存方案，不占用设备。",
    eps: [
      { m: "GET", p: "/stations", req: "—", res: "200 List<StationDto>(id, code, name, lat, lng)", err: "—", fe: "/ship 地图上的站点" },
      { m: "POST", p: "/quotes", req: "QuoteRequest(item{description, fragile}, weight_kg, pickup{text, lat, lng}, dropoff{…}, notes?, arrive_within_minutes?)  // 空 = ASAP；截止时间由后端用服务器时间计算", res: "201 QuoteDto(quote_id, expires_at, options[6]{option_id, station, device_type, available, unavailable_reason, departs_at, eta_at, price_cents, distance_m, route_points, tags})", err: "400 VALIDATION_ERROR · 400 OUT_OF_SERVICE_AREA · 400 SAME_ADDRESS", fe: "/ship/plans 进入页面、改 Arrive within" },
    ] },
  OrderController: { label: "OrderController", kind: "controller", x: 200, y: 260, w: 200, h: 44, phase: "mvp", pkg: PKG + ".order",
    role: "下单、订单列表、订单详情、取消。所有查询都只返回当前用户自己的订单，别人的订单一律 404。",
    eps: [
      { m: "POST", p: "/orders", req: "OrderRequest(quote_id, option_id, recipient{name, phone})；Header Idempotency-Key", res: "201 OrderDto(order_id, status, device, price_cents, departs_at, eta_at)", err: "409 QUOTE_EXPIRED · 409 QUOTE_STALE · 409 DEADLINE_MISSED · 409 DEVICE_UNAVAILABLE · 404 OPTION_NOT_FOUND", fe: "/ship/plans 底部确认条 Place order（MVP 不做 Checkout 页）" },
      { m: "GET", p: "/orders", req: "?limit=100（MVP 前端本地筛选）", res: "200 List<OrderSummaryDto>", err: "—", fe: "/orders" },
      { m: "GET", p: "/orders/{id}", req: "—", res: "200 OrderDetailDto(…, pickup_text, dropoff_text, notes, route_points, departs_at, eta_at, cancellable, timeline[], review)", err: "404 ORDER_NOT_FOUND", fe: "/orders/[id]、追踪页先取路线" },
      { m: "POST", p: "/orders/{id}/cancel", req: "CancelRequest(reason)", res: "200 OrderDto(status = canceled)", err: "409 NOT_CANCELLABLE（设备已出发）", fe: "/orders 抽屉、追踪页 Cancel order（仅出发前显示）" },
    ] },
  TrackingController: { label: "TrackingController", kind: "controller", x: 200, y: 340, w: 200, h: 44, phase: "mvp", pkg: PKG + ".tracking",
    role: "返回 SseEmitter 长连接。订单到终态后由服务端关闭。",
    eps: [
      { m: "SSE", p: "GET /orders/{id}/track", req: "Header Authorization、Last-Event-ID（重连时）", res: "text/event-stream：event status {status, at}（带 id）· event position {lat, lng, progress, remaining_s}；15 秒心跳", err: "404 ORDER_NOT_FOUND", fe: "/orders/[id]/track" },
    ] },
  ReviewController: { label: "ReviewController", kind: "controller", x: 200, y: 420, w: 200, h: 44, phase: "mvp", pkg: PKG + ".review",
    role: "订单完成后提交评价，每单一次。",
    eps: [
      { m: "POST", p: "/orders/{id}/review", req: "ReviewRequest(rating 1–5, comment?)", res: "201 ReviewDto(order_id, rating, comment)", err: "400 VALIDATION_ERROR · 409 NOT_COMPLETED · 409 ALREADY_REVIEWED", fe: "/orders/[id] 完成后的评价表单" },
    ] },
  RecommendationController: { label: "RecommendationController", kind: "controller", x: 200, y: 500, w: 200, h: 44, phase: "later", pkg: PKG + ".ai",
    role: "Smart Recommendation 阶段。基于实时信号和用户偏好推荐方案并给出理由。",
    eps: [ { m: "POST", p: "/ai/recommendation", req: "RecommendationRequest(quote_id, preference, user_note)", res: "200 RecommendationDto(recommended_option_id, headline, reasons[], signals, alternative)", err: "409 QUOTE_EXPIRED · 503 AI_UNAVAILABLE", fe: "/ship Step 2 推荐横幅" } ] },
  AgentController: { label: "AgentController", kind: "controller", x: 200, y: 580, w: 200, h: 44, phase: "later", pkg: PKG + ".agent",
    role: "Agent Mode 阶段。对话式下单，Agent 只能提议，用户确认后才执行。",
    eps: [
      { m: "SSE", p: "POST /agent/chat", req: "AgentChatRequest(conversation_id, message)", res: "events: tool_call · tool_result · token · ui · confirm_required · done", err: "503 AI_UNAVAILABLE", fe: "/ship Agent 模式" },
      { m: "POST", p: "/agent/actions/{id}/confirm", req: "—", res: "201 ActionResultDto(order_id)", err: "409 ACTION_EXPIRED", fe: "确认卡片" },
    ] },

  // ---- Service ----
  UserService: { label: "UserService", kind: "service", x: 460, y: 100, w: 200, h: 44, phase: "mvp", pkg: PKG + ".user",
    role: "注册时用 PasswordEncoder 哈希密码；登录校验后用 JwtService 签发 token；Google 登录先验证 id_token，再按 google_sub 找用户；找不到且 email_verified 时绑定到同邮箱账号，否则新建。改密码时 token_version +1 并签发新 token。",
    methods: ["AuthResponse register(String email, String password, String displayName)", "AuthResponse login(String email, String password)", "AuthResponse loginWithGoogle(String idToken)", "UserDto getCurrentUser(UUID userId)", "UserDto updateProfile(UUID userId, String displayName)", "AuthResponse changePassword(UUID userId, String current, String next)"],
    errors: ["EmailTakenException → 409 EMAIL_TAKEN", "InvalidCredentialsException → 401", "InvalidGoogleTokenException → 401", "NoPasswordException → 409 NO_PASSWORD"],
    tables: ["app_user", "user_credential"] },
  QuoteService: { label: "QuoteService", kind: "service", x: 460, y: 180, w: 200, h: 44, phase: "mvp", pkg: PKG + ".quote",
    role: "方案 = 活跃站点列表 × 设备类型列表，MVP 是 3 × 2 = 6 个；加站点或设备类型时自动变多，不用改代码。逐个计算路线、硬约束（超重 / 陡坡 / 超航程）、该站该类设备的最早空闲时间（设备忙也能下单，排在当前任务之后）、ETA（含等待时间）、价格、是否赶得上 deadline（DEADLINE_MISSED），再打 fastest / cheapest / recommended 标签，最后整体保存。纯计算，同样输入得到同样输出。",
    methods: ["QuoteDto createQuote(UUID userId, QuoteRequest req)", "List<StationDto> listStations()", "// private", "OptionResult evaluate(Station s, DeviceType t, QuoteRequest req, RoutePlan plan)", "int priceCents(BigDecimal weightKg, double leg2Meters)  // max(kg × 英里 × $1, $1)", "void assignTags(List<OptionResult> options)"],
    errors: ["OutOfServiceAreaException → 400", "SameAddressException → 400"],
    tables: ["quote", "quote_option", "station / device（读）", "device_block（读）"],
    code: `价格 = weight_kg × ② 取件→收件 英里数 × $1（两种设备同价）
  机器人用路网距离，无人机用直线距离
  参数放在 skylane.pricing.usd-per-kg-mile，可调
不可用原因：OVERWEIGHT（无人机 > 2 kg，机器人 > 10 kg）· STEEP_TERRAIN
  · OUT_OF_RANGE（无人机往返 > 15 km）· NO_DEVICE_AVAILABLE · DEADLINE_MISSED
  最低 $1（skylane.pricing.min-cents）
出发时间 = max(现在, 该站该类设备最早空闲时间)
ETA = 出发时间 + (① + ②) ÷ 速度 + 装卸
  drone 15 m/s（+ 起降各 1 分钟），robot 1.5 m/s
recommended = 0.6 × 到达时间 + 0.4 × 价格（归一化后）最低` },
  OrderService: { label: "OrderService", kind: "service", x: 460, y: 260, w: 200, h: 44, phase: "mvp", focal: true, pkg: PKG + ".order",
    role: "整个 MVP 最关键的类。下单在一个 @Transactional 里完成：校验报价、锁定候选设备、写入设备占用、创建订单。数据库排斥约束保证同一台设备不会被两个订单同时占用。",

// ---------------- 几何 ----------------
const R = 8;
function rounded(pts) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i - 1], [x, y] = pts[i], [nx, ny] = pts[i + 1];
    const l1 = Math.hypot(x - px, y - py), l2 = Math.hypot(nx - x, ny - y);
    const r = Math.min(R, l1 / 2, l2 / 2);
    const ax = x - (x - px) / l1 * r, ay = y - (y - py) / l1 * r;
    const bx = x + (nx - x) / l2 * r, by = y + (ny - y) / l2 * r;
    d += ` L${ax},${ay} Q${x},${y} ${bx},${by}`;
  }
  const last = pts[pts.length - 1];
  return d + ` L${last[0]},${last[1]}`;
}
function edgePts(a, b, o = {}) {
  if (o.pts) return o.pts;
  const x1 = a.x + a.w, y1 = a.y + a.h / 2 + (o.fy || 0);
  const x2 = b.x, y2 = b.y + b.h / 2 + (o.ty || 0);
  if (y1 === y2) return [[x1, y1], [x2, y2]];
  const mid = o.mid ?? (x1 + x2) / 2;
  return [[x1, y1], [mid, y1], [mid, y2], [x2, y2]];
}

    const p = el("path", { class: "edge" + (isLater(a) || isLater(bb) ? " later" : ""), d: rounded(edgePts(N[a], N[bb], o)), "marker-end": "url(#arw)" }, g);
    edgeEls.push({ p, a, b: bb });
  });
  REPOS.forEach(r => {
    const n = N[r], y = n.y + n.h / 2;
    const p = el("path", { class: "edge", d: `M${n.x + n.w},${y} H${BUS_X}` }, g);
    edgeEls.push({ p, a: r, b: "Database" });
  });
  const db = N.Database;
  el("path", { class: "edge", d: `M${BUS_X},${N.UserRepository.y + 20} V${N.ReviewRepository.y + 20}` }, g);
  const busIn = el("path", { class: "edge", d: `M${BUS_X},${db.y + db.h / 2} H${db.x}`, "marker-end": "url(#arw)" }, g);
  REPOS.forEach(r => edgeEls.push({ p: busIn, a: r, b: "Database", shared: true }));

  // 节点
  for (const id in N) {
    const n = N[id];
    const cls = ["node", n.kind === "external" ? "ext" : "", n.phase === "later" ? "later" : "", n.focal ? "focal" : ""].join(" ");
    const ng = el("g", { class: cls, tabindex: 0, role: "button", "data-id": id, "aria-label": n.label }, svg);
    if (n.kind === "db") {
      const rx = n.w / 2, ry = 9;
      el("path", { class: "shape", d: `M${n.x},${n.y + ry} A${rx},${ry} 0 0 1 ${n.x + n.w},${n.y + ry} V${n.y + n.h - ry} A${rx},${ry} 0 0 1 ${n.x},${n.y + n.h - ry} Z` }, ng);
      el("path", { class: "shape", d: `M${n.x},${n.y + ry} A${rx},${ry} 0 0 0 ${n.x + n.w},${n.y + ry}`, fill: "none" }, ng);
    } else if (n.kind === "client") {
      el("rect", { x: n.x, y: n.y, width: n.w, height: n.h, rx: 10 }, ng);
      el("line", { x1: n.x, x2: n.x + n.w, y1: n.y + 16, y2: n.y + 16, stroke: "var(--rule-solid)" }, ng);
      [10, 20, 30].forEach(dx => el("circle", { cx: n.x + dx, cy: n.y + 8, r: 2.5, fill: "var(--rule-solid)" }, ng));
    } else {
      el("rect", { x: n.x, y: n.y, width: n.w, height: n.h, rx: n.kind === "external" ? n.h / 2 : 6 }, ng);
    }
    const cy = n.y + n.h / 2 + (n.kind === "client" ? 8 : 0) + (n.kind === "db" ? 2 : 0);
    const t = el("text", { x: n.x + n.w / 2, y: n.sub ? cy - 7 : cy }, ng); t.textContent = n.label;
    if (n.sub) { const s = el("text", { class: "sub", x: n.x + n.w / 2, y: cy + 10 }, ng); s.textContent = n.sub; }
    ng.addEventListener("click", () => select(id));
    ng.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(id); } });
  }
  applyPhase();
}

// ---------------- 交互 ----------------
let current = "OrderService";
function select(id) {
  current = id;
  svg.classList.add("dim");
  svg.querySelectorAll(".node").forEach(g => {
    const nid = g.dataset.id;
    g.classList.toggle("sel", nid === id);
    g.classList.toggle("nb", nid !== id && (OUT[id].includes(nid) || IN[id].includes(nid)));
  });
  edgeEls.forEach(({ p }) => { p.classList.remove("out", "in"); p.setAttribute("marker-end", p.getAttribute("marker-end") ? "url(#arw)" : ""); if (!p.getAttribute("marker-end")) p.removeAttribute("marker-end"); });
  edgeEls.forEach(({ p, a, b }) => {
    if (a === id) { p.classList.add("out"); if (p.hasAttribute("marker-end")) p.setAttribute("marker-end", "url(#arw-o)"); }
    else if (b === id) { p.classList.add("in"); if (p.hasAttribute("marker-end")) p.setAttribute("marker-end", "url(#arw-i)"); }
  });
  render(id);
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
}

const KIND = { client: "前端", app: "应用入口", controller: "Controller", service: "Service", component: "Component", repo: "Repository", external: "外部服务", db: "数据库", config: "配置 / 安全" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render(id) {
  const n = N[id];
  let h = `<div class="ihead"><div class="chips"><span class="chip">${KIND[n.kind]}</span><span class="chip ${n.phase === "mvp" ? "mvp" : ""}">${n.phase === "mvp" ? "MVP" : "后续阶段"}</span></div>
    <h2 class="iname">${esc(n.label)}</h2>${n.pkg ? `<div class="pkg">${esc(n.pkg)}</div>` : ""}</div>
    <p class="role">${esc(n.role)}</p>`;
  if (n.pages) {
    h += `<div class="sec"><h3>页面 ↔ 接口对齐</h3><div class="tw"><table><thead><tr><th>页面</th><th>做什么</th><th>调用</th></tr></thead><tbody>${n.pages.map(([p, d, a]) => `<tr><td class="mono">${esc(p)}</td><td>${esc(d)}</td><td class="mono">${esc(a)}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  if (n.eps) {
    h += `<div class="sec"><h3>接口</h3>${n.eps.map(e => `<div class="ep"><div class="line"><span class="verb ${e.m === "SSE" ? "sse" : ""}">${e.m}</span><span class="path">${esc(e.p)}</span></div>
      <dl class="kv"><dt>请求</dt><dd class="mono">${esc(e.req)}</dd><dt>响应</dt><dd class="mono">${esc(e.res)}</dd><dt>错误</dt><dd class="mono">${esc(e.err)}</dd><dt>前端</dt><dd>${esc(e.fe)}</dd></dl></div>`).join("")}</div>`;
  }
  if (n.methods) h += `<div class="sec"><h3>方法</h3><pre>${n.methods.map(esc).join("\n")}</pre></div>`;
  if (n.code) h += `<div class="sec"><h3>${n.kind === "app" ? "配置" : "要点"}</h3><pre>${esc(n.code)}</pre></div>`;
  if (n.errors) h += `<div class="sec"><h3>抛出的异常</h3><ul>${n.errors.map(e => `<li class="mono">${esc(e)}</li>`).join("")}</ul></div>`;
  if (n.tables) h += `<div class="sec"><h3>数据表</h3><div class="links">${n.tables.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div></div>`;
  const btns = (list, cls) => list.length ? `<div class="links">${[...new Set(list)].map(x => `<button class="${cls}" data-go="${x}">${esc(N[x].label)}</button>`).join("")}</div>` : `<div class="none">无</div>`;
  h += `<div class="sec"><h3>调用</h3>${btns(OUT[id], "o")}</div><div class="sec"><h3>被谁调用</h3>${btns(IN[id], "i")}</div>`;
  const insp = document.getElementById("inspector");
  insp.innerHTML = h;
  insp.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
    const t = b.dataset.go;
    if (isLater(t) && !document.getElementById("showLater").checked) { document.getElementById("showLater").checked = true; applyPhase(); }
    select(t);
  }));
}

function applyPhase() {
  const show = document.getElementById("showLater").checked;
  svg.querySelectorAll(".node").forEach(g => { if (isLater(g.dataset.id)) g.style.display = show ? "" : "none"; });
  edgeEls.forEach(({ p, a, b }) => { if (isLater(a) || isLater(b)) p.style.display = show ? "" : "none"; });
}
document.getElementById("showLater").addEventListener("change", applyPhase);

draw();
const start = decodeURIComponent((location.hash || "").slice(1));
select(N[start] ? start : "OrderService");
</script>
